name: AIAgent
options:
  bundleIdPrefix: com.aidevice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO

targets:
  AIAgent:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: AI 助手
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        LSApplicationQueriesSchemes:
          - weixin
          - wechat
          - mqq
          - mqqopensdkapiV2
          - alipay
          - mobilenotes
          - shortcuts
          - clock
          - sms
          - tel
          - mailto
          - maps
          - itms-apps
          - prefs
          - instagram
          - youtube
          - bilibili
          - douyin
          - snssdk1128
          - xhsdiscover
          - taobao
          - openapp.jdmobile
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: 用于拍摄图片并交给 AI 处理
        NSPhotoLibraryUsageDescription: 用于选择图片并交给 AI 处理
        NSMicrophoneUsageDescription: 用于语音输入
        NSLocalNetworkUsageDescription: 用于连接你电脑上的控制代理
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aidevice.agent
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
