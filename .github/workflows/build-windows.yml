name: build-windows-agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pyautogui pyperclip pillow mss pyinstaller

      - name: 打包 exe
        run: |
          pyinstaller --onefile --name AI-Agent --clean --noconfirm `
            --collect-all uvicorn --collect-all fastapi --collect-all starlette `
            --collect-all pyautogui --collect-all pymsgbox --collect-all pyperclip `
            agent/agent.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-windows
          path: dist/AI-Agent.exe
          retention-days: 90
